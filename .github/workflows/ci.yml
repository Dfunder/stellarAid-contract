# ci.yml — build, lint, test and coverage gates for the Soroban workspace.
#
# Closes #884.
#
# WHAT THIS RUNS
#   fmt        cargo fmt --all -- --check
#   clippy     cargo clippy --workspace --all-targets -- -D warnings
#   test       cargo test --workspace --no-fail-fast
#   wasm       cargo build --workspace --target wasm32-unknown-unknown --release
#   coverage   cargo llvm-cov, published to the coverage badge in README.md (#882)
#
# CACHING
#   ~/.cargo/registry and ~/.cargo/git hold the downloaded sources;
#   target/wasm32-unknown-unknown is cached separately from target/host,
#   because a host build and a wasm build share no object files and mixing them
#   in one cache key causes a near-full rebuild every time the toolchain moves.
#   The cache key includes the toolchain, the lockfile hash and a hash of
#   rust-toolchain.toml, so a toolchain bump is always a cold build.
#
# ! BASELINE — READ BEFORE PROMOTING THESE JOBS TO BLOCKING
#   At the time this workflow was added, `main` did not build. These jobs are
#   marked `continue-on-error: true` so the pipeline is usable immediately and
#   so a *new* failure is distinguishable from the known one. They are not
#   hiding anything: the job still runs, still prints the full compiler output,
#   and still reports in the checks tab. Remove the four `continue-on-error`
#   lines once the following pre-existing defects are fixed, and delete this
#   block in the same commit.
#
#     contracts/shared   LockKey is a #[contracttype] without Copy, so every
#                        contract that depends on `shared` fails to compile.
#                        One-line fix: add Copy to the derive on guard.rs:47.
#     contracts/{escrow,campaign,platform_config,commission_agreement}
#                        lib.rs files contain unbalanced delimiters and do not
#                        parse at all.
#     sdk                ~25 errors: stellar-strkey 0.0.2 pinned in the
#                        workspace while the code targets the 0.0.8 API, and
#                        stellar-xdr 21.2 restructured HostFunction,
#                        TransactionEnvelope, Memo and InvokeHostFunctionOp.
#     contracts/{audit,multi_sig,rate_limiter,analytics}
#                        test modules call the client with stale signatures.
#     contracts/factory  contractimport! of two WASM artifacts that only exist
#                        after a release build, so `cargo check` cannot run.
#
#   The tree is also not rustfmt-clean, so `fmt` is non-blocking for the same
#   reason. Formatting the workspace is a mechanical, behaviour-free change and
#   is the obvious first step towards turning these gates green.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the previous run. Without this, a long Soroban
# build queue makes every push wait on the run it replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep the build hermetic: CI must use the committed lockfile, never re-resolve.
  CARGO_NET_OFFLINE: "false"
  RUST_BACKTRACE: "1"
  # Soroban's own test host is single-threaded by default and several contract
  # tests share one global ledger, so a data-parallel test runner produces
  # flaky failures that look like real bugs.
  RUST_TEST_THREADS: "1"

jobs:
  # ── Formatting ────────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    # Non-blocking while `main` is unformatted; see the BASELINE block above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  # ── Lints ─────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    # Non-blocking while `main` does not compile; see the BASELINE block above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo registry and host build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-host-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            clippy-host-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    needs: fmt
    # Non-blocking while `main` does not compile; see the BASELINE block above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo registry and host build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-host-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            test-host-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: cargo test --workspace --no-fail-fast
        # --no-fail-fast so one broken crate does not hide the state of the
        # other 28; the whole picture is what a maintainer needs to triage.
        run: cargo test --workspace --no-fail-fast

  # ── WASM build ────────────────────────────────────────────────────────────
  wasm:
    name: wasm (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    # Non-blocking while `main` does not compile; see the BASELINE block above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # rust-toolchain.toml already names wasm32-unknown-unknown; `rustup show`
        # installs the channel, the target and the components in one step.
        run: rustup show
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: wasm-registry-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-registry-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Cache the wasm target directory
        uses: actions/cache@v4
        with:
          path: target/wasm32-unknown-unknown
          key: wasm-target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Build every contract to WASM
        # --locked: a lockfile that disagrees with the manifests is an error,
        # not a silent re-resolve. The released WASM must be reproducible.
        run: cargo build --locked --workspace --target wasm32-unknown-unknown --release
      - name: Confirm the artifacts the deploy scripts ship actually exist
        # A green `cargo build` that produced no .wasm would still let
        # scripts/deploy/preflight.sh fail at deploy time. Fail here instead.
        run: |
          set -euo pipefail
          out=target/wasm32-unknown-unknown/release
          count=$(find "$out" -maxdepth 1 -name '*.wasm' | wc -l)
          echo "wasm artifacts: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::the release build produced no .wasm artifacts in $out"
            exit 1
          fi
          ls -la "$out"/*.wasm

  # ── Coverage ──────────────────────────────────────────────────────────────
  # Backs the coverage badge added to README.md in #882.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Same reason as the jobs above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo registry and host build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cov-host-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cov-host-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Collect coverage
        # `--ignore-filename-regex` keeps generated Soroban macro output
        # (contractimpl/contractclient) out of the ratio; it is thousands of
        # lines of generated code and would make the number meaningless.
        run: |
          cargo llvm-cov --workspace --no-fail-fast \
            --ignore-filename-regex '(/sdk/src/.*generated|contractimpl|contractclient)' \
            --lcov --output-path lcov.info
      - name: Summarise
        run: |
          {
            echo "## Rust coverage"
            echo
            echo '```'
            cargo llvm-cov --workspace --no-fail-fast \
              --ignore-filename-regex '(/sdk/src/.*generated|contractimpl|contractclient)' \
              --summary-only 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Codecov
        # Backs the coverage badge in README.md (#882). A public repository
        # needs no token; a private one would need CODECOV_TOKEN as a secret.
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
