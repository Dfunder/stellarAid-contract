# ci.yml — Rust quality gates for the Soroban workspace.
#
# INVARIANT: the commands below are the same commands the Makefile runs.
# `make test`, `make lint` and `make build` use the flag sets declared at the
# top of the Makefile; this workflow spells them out so a GitHub run and a
# local run cannot silently drift. Update both files in the same PR.
#
# RUST_TEST_THREADS is pinned here and exported by the Makefile for the same
# reason: Soroban's test host shares one ledger across tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "1"

jobs:
  quality:
    name: fmt, lint, test, wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Format
        run: cargo fmt --all -- --check

      # Identical to `make lint`.
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Identical to `make test`.
      - name: Test
        run: cargo test --workspace --no-fail-fast --locked

      # Identical to `make build`.
      - name: Build contracts
        run: cargo build --workspace --target wasm32-unknown-unknown --release --locked
