# security.yml — dependency and code security gates.
#
# Closes #883, #1147, #1148.
#
# The checklists in docs/SECURITY_AUDIT_CHECKLIST.md and
# docs/SECURITY_REVIEW_CHECKLIST.md are enforced here:
#
#   cargo-audit   RustSec advisory database — RUSTSEC-* on anything reachable
#   cargo-deny    licences, sources, duplicate and banned crates
#   security-lint scripts/security_lint.sh — the repo-specific rules
#   clippy-sec    clippy with correctness/suspicious lint groups promoted to errors
#   npm-audit     npm dependency audit for @stellaraid/wallet-adapters in sdk/bindings (#1148)
#
# PINNING
#   All third-party actions are pinned to full 40-character commit SHAs (#1147).

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Install cargo-audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit the dependency graph
        run: cargo audit

  cargo-deny:
    name: cargo deny (licences, sources, duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.49.18
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

  # Repo-specific security checklist scan
  security-lint:
    name: security lint (checklist rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run the checklist lint
        run: |
          ./scripts/security_lint.sh --report
          ./scripts/security_lint.sh

  clippy-security:
    name: clippy (security lints)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Cache cargo registry and host build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sec-clippy-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sec-clippy-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Run the security lint groups as errors
        run: |
          cargo clippy --workspace --all-targets \
            -- -D clippy::correctness \
               -D clippy::suspicious

  # ── npm audit for @stellaraid/wallet-adapters (#1148) ────────────────────
  npm-audit:
    name: npm audit (sdk/bindings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/bindings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/bindings/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies against allowlist
        run: node ../../scripts/npm_audit.js
