# typescript-ci.yml — quality gates for the TypeScript wallet adapters.
#
# Closes #885, #1147.
#
# WHAT THIS RUNS
#   typecheck  tsc --noEmit            types, with no output written
#   lint       eslint src test         flat config, type-aware rules
#   test       vitest run              registry and detection behaviour
#   build      tsc                     emits dist/, the published artifact
#
# PINNING
#   All third-party actions are pinned to full 40-character commit SHAs (#1147).

name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "sdk/bindings/**"
      - "sdk/**"
      - ".github/workflows/typescript-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/bindings/**"
      - "sdk/**"
      - ".github/workflows/typescript-ci.yml"
  workflow_dispatch:

concurrency:
  group: ts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sdk/bindings

jobs:
  quality:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/bindings/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify the lockfile is in sync
        run: npm ls --depth=0

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Confirm the published entry point exists
        run: |
          set -euo pipefail
          for f in dist/index.js dist/index.d.ts; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not emitted by \`npm run build\`"
              exit 1
            fi
            echo "ok: $f ($(wc -c < "$f") bytes)"
          done

  types-surface:
    name: published .d.ts is complete and usable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
      - name: Install and build
        working-directory: sdk/bindings
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Every source module emitted a declaration file
        run: |
          set -euo pipefail
          missing=0
          for f in $(find src -name '*.ts' -not -name '*.d.ts' | sort); do
            base="${f#src/}"
            out="dist/${base%.ts}.d.ts"
            if [ ! -f "$out" ]; then
              echo "::error::$f has no emitted declaration at $out"
              missing=1
            else
              echo "ok: $out"
            fi
          done
          [ "$missing" -eq 0 ]
      - name: Typecheck a consumer against dist/
        run: |
          set -euo pipefail
          mkdir -p .ci-consumer
          cat > .ci-consumer/consumer.ts <<'EOF'
          import type { WalletAdapter } from "../dist/index.js";
          import {
            WalletAdapterRegistry,
            getAdapterByName,
            getDefaultAdapter,
          } from "../dist/index.js";

          const registry: readonly WalletAdapter[] = WalletAdapterRegistry;
          const first: string = registry[0].name;
          const maybe: WalletAdapter | null = getDefaultAdapter();
          const byName: WalletAdapter | null = getAdapterByName(first);

          export const surface = { first, maybe, byName, size: registry.length };
          EOF
          npx tsc --noEmit --strict --skipLibCheck --module esnext \
            --moduleResolution bundler --target es2020 .ci-consumer/consumer.ts
          rm -rf .ci-consumer

  sdk-utils:
    name: sdk utils tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"

      - name: Install
        working-directory: sdk
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Test
        working-directory: sdk
        run: npm test
