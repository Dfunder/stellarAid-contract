[workspace]
members = [
    "contracts/shared",
    "contracts/escrow",
    "contracts/verification",
    "contracts/multi_sig",
    "multi_wallet_session",
    "wallet_sign_timeout",
    "contracts/campaign_factory",
]
resolver = "2"

# NOTE (#918): Workspace membership reflects crates present in this checkout.
# Present contract crates (each with Cargo.toml and
# [package.metadata.stellar-aid]) are registered above: shared, escrow,
# verification, multi_sig, campaign_factory.
#
# contracts/campaign is not present on disk in this checkout and is therefore
# not a workspace member. contracts/donation and contracts/withdrawal are
# not present on disk and are not registered workspace members; if/when added
# they must be audited, given [package.metadata.stellar-aid], and registered as
# members (or explicitly excluded with rationale) before being built.

[workspace.package]
version = "0.1.0"
edition = "2021"

# Workspace-wide contract versioning (closes #682). Per-crate copies live in
# contracts/*/Cargo.toml under [package.metadata.stellar-aid].
[workspace.metadata.stellar-aid]
versioning = "semver"
storage-schema = 1
min-compatible = "0.1.0"

[workspace.dependencies]
soroban-sdk = { version = "21.0.0" }

# Soroban size-tuned release profile (see docs/WASM_SIZE_BUDGET.md, #1118).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
