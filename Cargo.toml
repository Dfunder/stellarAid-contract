[workspace]
members = [
    "contracts/shared",
    "contracts/platform_config",
    "contracts/escrow",
    "contracts/commission_agreement",
    "contracts/dispute_arbiter",
    "contracts/analytics",
    "contracts/reputation",
    "contracts/messaging",
    "contracts/subscription",
    "contracts/competitions",
    "contracts/verification",
    "contracts/search",
    "contracts/revenue_sharing",
    "contracts/recruitment",
    "contracts/creator_fund",
    "contracts/rate_limiter",
    "contracts/multi_sig",
    "contracts/audit",
    "contracts/nft",
    "contracts/dao",
    "contracts/ecosystem_funding",
    "contracts/licensing",
    "contracts/mentorship",
    "contracts/campaign",
    "contracts/campaign_factory",
    "contracts/campaign_instance",
    "contracts/factory",
    "sdk",
    "tests/framework",
    "tests/upgrade_testing",
]
resolver = "2"

# NOTE: `contracts/campaign` is a workspace member and is built with the
# workspace. `contracts/donation` and `contracts/withdrawal` exist on disk but
# are not workspace members (unaudited and not registered), so they are not
# built by `cargo build --workspace` and are excluded until separately audited
# and registered.
#
# NOTE (#923): `worker/` and `multi_wallet_session/` are not present in this
# checkout and are not workspace members. They are not compiled by workspace
# checks/CI here. If added, register them as workspace members (or cover them
# with a dedicated CI job) and document the decision explicitly.
#
# NOTE (#924): `tests/wallet_integration/` is not present in this checkout and
# is not a workspace member. It is not run by `cargo test --workspace`. If
# added, register it as a workspace member, keep network-dependent tests
# `#[ignore]`d by default with opt-in docs, and ensure clippy passes.

[workspace.package]
version = "0.1.0"
edition = "2021"

# Workspace-wide contract versioning (closes #682). Per-crate copies live in
# contracts/*/Cargo.toml under [package.metadata.stellar-aid].
[workspace.metadata.stellar-aid]
versioning = "semver"
storage-schema = 1
min-compatible = "0.1.0"

[workspace.dependencies]
soroban-sdk = { version = "21.0.0" }
# 0.0.8 is the API the SDK is written against (`stellar_strkey::ed25519::*`
# and `stellar_strkey::Contract`); it is also the version `stellar-xdr` 21
# already pulls in, so this removes the duplicate 0.0.2 copy. The 0.0.2 pin
# only exposed `Strkey::{PublicKeyEd25519, PrivateKeyEd25519}` and had no
# `ed25519` module, so `sdk` could not compile against it (issue #5).
stellar-strkey = "0.0.8"
stellar-xdr = "21.0.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ethnum = { version = "1.5.3" }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
