[workspace]
members = [
    "contracts/shared",
    "contracts/platform_config",
    "contracts/escrow",
    "contracts/commission_agreement",
    "contracts/dispute_arbiter",
    "contracts/analytics",
    "contracts/reputation",
    "contracts/messaging",
    "contracts/subscription",
    "contracts/competitions",
    "contracts/verification",
    "contracts/reputation",
    "contracts/search",
    "contracts/revenue_sharing",
    "contracts/recruitment",
    "contracts/creator_fund",
    "sdk",
    "tests/framework",
    "tests/upgrade_testing",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# Workspace-wide contract versioning (closes #682). Per-crate copies live in
# contracts/*/Cargo.toml under [package.metadata.stellar-aid].
[workspace.metadata.stellar-aid]
versioning = "semver"
storage-schema = 1
min-compatible = "0.1.0"

[workspace.dependencies]
soroban-sdk = { version = "21.0.0" }
stellar-strkey = "0.0.2"
stellar-xdr = "21.0.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ethnum = { version = "1.5.3" }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
