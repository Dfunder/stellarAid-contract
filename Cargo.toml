[workspace]
members = [
    "contracts/shared",
    "contracts/escrow",
    "contracts/verification",
    "contracts/multi_sig",
    "multi_wallet_session",
    "wallet_sign_timeout",
]
resolver = "2"

# NOTE: `contracts/campaign` is a workspace member and is built with the
# workspace. `contracts/donation` and `contracts/withdrawal` exist on disk but
# are not workspace members (unaudited and not registered), so they are not
# built by `cargo build --workspace` and are excluded until separately audited
# and registered.

[workspace.package]
version = "0.1.0"
edition = "2021"

# Workspace-wide contract versioning (closes #682). Per-crate copies live in
# contracts/*/Cargo.toml under [package.metadata.stellar-aid].
[workspace.metadata.stellar-aid]
versioning = "semver"
storage-schema = 1
min-compatible = "0.1.0"

[workspace.dependencies]
soroban-sdk = { version = "21.0.0" }
