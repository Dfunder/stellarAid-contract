[workspace]
members = [
    "contracts/shared",
    "contracts/platform_config",
    "contracts/escrow",
    "contracts/commission_agreement",
    "contracts/dispute_arbiter",
    "contracts/messaging",
    "contracts/subscription",
    "contracts/competitions",
    "contracts/verification",
    "contracts/reputation",
    "contracts/search",
    "contracts/revenue_sharing",
    "contracts/recruitment",
    "contracts/creator_fund",
    "tests/upgrade_testing",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# Workspace-wide contract versioning (closes #682). Per-crate copies live in
# contracts/*/Cargo.toml under [package.metadata.stellar-aid].
[workspace.metadata.stellar-aid]
versioning = "semver"
storage-schema = 1
min-compatible = "0.1.0"

[workspace.dependencies]
soroban-sdk = { version = "21.0.0" }
