[workspace]
members = [
    "contracts/shared",
    "contracts/platform_config",
    "contracts/escrow",
    "contracts/commission_agreement",
    "contracts/dispute_arbiter",
    "contracts/messaging",
    "contracts/subscription",
    "contracts/competitions",
    "contracts/verification",
    "contracts/revenue_sharing",
    "contracts/recruitment",
    "contracts/creator_fund",
    "contracts/reputation",
    "contracts/search",
    "contracts/analytics",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
soroban-sdk = { version = "21.0.0" }

[patch.crates-io]
# ethnum 1.5.0 fails to compile with Rust ≥ 1.82 due to a transmute size
# mismatch in error.rs.  Patch to v1.5.3 which fixes the issue.
ethnum = { git = "https://github.com/nlordell/ethnum-rs", tag = "v1.5.3" }
