[workspace]
members = [
    "contracts/shared",
    "contracts/escrow",
    "contracts/verification",
    "contracts/multi_sig",
    "multi_wallet_session",
    "wallet_sign_timeout",
]
resolver = "2"

# NOTE: `contracts/campaign` is a workspace member and is built with the
# workspace. `contracts/donation` and `contracts/withdrawal` exist on disk but
# are not workspace members (unaudited and not registered), so they are not
# built by `cargo build --workspace` and are excluded until separately audited
# and registered.

[workspace.package]
version = "0.1.0"
edition = "2021"

# Workspace-wide contract versioning (closes #682). Per-crate copies live in
# contracts/*/Cargo.toml under [package.metadata.stellar-aid].
[workspace.metadata.stellar-aid]
versioning = "semver"
storage-schema = 1
min-compatible = "0.1.0"

[workspace.dependencies]
soroban-sdk = { version = "21.0.0" }
# 0.0.8 is the API the SDK is written against (`stellar_strkey::ed25519::*`
# and `stellar_strkey::Contract`); it is also the version `stellar-xdr` 21
# already pulls in, so this removes the duplicate 0.0.2 copy. The 0.0.2 pin
# only exposed `Strkey::{PublicKeyEd25519, PrivateKeyEd25519}` and had no
# `ed25519` module, so `sdk` could not compile against it (issue #5).
stellar-strkey = "0.0.8"
stellar-xdr = "21.0.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ethnum = { version = "1.5.3" }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
