[package]
name = "escrow"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.stellar-aid]
versioning = "semver"
storage-schema = 1
min-compatible = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "escrow_benchmark"
path = "benches/escrow_benchmark.rs"
required-features = ["nightly-bench"]

[features]
testutils = ["soroban-sdk/testutils"]
nightly-bench = []

[dependencies]
soroban-sdk = { version = "21.0.0" }
shared = { path = "../shared", version = "0.1.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }