[package]
name = "reputation"
version.workspace = true
edition.workspace = true
publish = false

[package.metadata.stellar-aid]
versioning = "semver"
storage-schema = 1
min-compatible = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "reputation_benchmark"
path = "benches/reputation_benchmark.rs"
harness = false

# Deterministic event-budget regression guard (closes #994).
# Runs under `cargo test` without needing `cargo bench`.
[[test]]
name = "event_budgets"
path = "tests/event_budgets.rs"

[dependencies]
soroban-sdk.workspace = true
shared = { path = "../shared", version = "0.1.0" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
default = []
testutils = ["soroban-sdk/testutils"]
