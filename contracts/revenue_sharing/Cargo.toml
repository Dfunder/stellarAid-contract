[package]
name = "revenue_sharing"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.stellar-aid]
versioning = "semver"
storage-schema = 2
min-compatible = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

# Gas / CPU benchmark for record_revenue (closes #989). `harness = false` so the
# benchmark is a plain stable-toolchain binary that `cargo bench -p
# revenue_sharing` really runs; it follows the #873 verification benchmark.
[[bench]]
name = "revenue_sharing_benchmark"
path = "benches/revenue_sharing_benchmark.rs"
harness = false

[dependencies]
soroban-sdk.workspace = true
shared = { path = "../shared", version = "0.1.0" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
default = []
testutils = ["soroban-sdk/testutils"]
