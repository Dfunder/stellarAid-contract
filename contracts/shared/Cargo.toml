[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[package.metadata.stellar-aid]
versioning = "semver"
storage-schema = 1
min-compatible = "0.1.0"

[lib]
crate-type = ["lib"]

[dependencies]
soroban-sdk = { workspace = true }

# The pagination helper is exercised through the SDK's in-memory test Env
# (Env::default / Vec), which lives behind the `testutils` feature.
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
default = []
testutils = ["soroban-sdk/testutils"]
