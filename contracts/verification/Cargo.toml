[package]
name = "verification"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.stellar-aid]
versioning = "semver"
storage-schema = 1
min-compatible = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

# Gas / CPU benchmarks (closes #873). `harness = false` so the benchmark is a
# plain stable-toolchain binary that `cargo bench -p verification` really runs;
# the libtest `Bencher` harness used by the escrow benchmark needs nightly.
[[bench]]
name = "verification_benchmark"
path = "benches/verification_benchmark.rs"
harness = false

[dependencies]
soroban-sdk.workspace = true
shared = { path = "../shared", version = "0.1.0" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
default = []
testutils = ["soroban-sdk/testutils"]
