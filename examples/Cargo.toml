[package]
name = "stellaraid-examples"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace so `cargo check --manifest-path examples/Cargo.toml`
# works even when the contract workspace is mid-rebuild.
[workspace]

[dependencies]
# Kept in lockstep with the workspace's `[workspace.dependencies]` pin; the
# examples use the 0.0.8 `ed25519` API and cannot compile against 0.0.2.
stellar-strkey = "0.0.8"
